[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preop-xai"
version = "0.1.0"
description = "Reproducible preoperative risk prediction research"
requires-python = ">=3.11,<3.12"
dependencies = [
  "polars", "pyarrow", "pandas", "numpy", "scipy", "scikit-learn",
  "xgboost", "shap", "matplotlib", "seaborn", "pyyaml", "joblib", "typer",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyterlab", "ipykernel"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

